name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  publish:
    name: Pack & publish to nuget.org
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC token for nuget.org trusted publishing (policy "nexer-release", workflow release.yml)
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Determine version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Nexer.slnx

      - name: Build
        run: dotnet build Nexer.slnx --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test Nexer.slnx --configuration Release --no-build

      - name: Pack
        run: >-
          dotnet pack Nexer.slnx --configuration Release --no-build
          -p:Version=${{ steps.version.outputs.version }} --output artifacts/pkg

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/pkg/*
          if-no-files-found: error

      # Exchanges the GitHub OIDC token for a short-lived (1 hour) nuget.org API key; keep it just before the push.
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: oisin

      - name: Publish
        # Symbol packages (.snupkg) next to each .nupkg are pushed automatically.
        run: >-
          dotnet nuget push "artifacts/pkg/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
